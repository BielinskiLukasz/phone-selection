<!doctype html>
<html lang="pl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Wybierz telefon po cechach, nie po nazwie. Quiz, suwaki i trzy anonimowe propozycje — nazwę odkrywamy dopiero po Twoim wyborze." />
    <meta name="theme-color" content="#faf8f5" />
    <title>Wybór telefonu</title>
    <script>
      // Motyw ustawiony przed pierwszym renderem, żeby nie było błysku (UI-SPEC 6).
      try {
        if (localStorage.getItem('wybor-telefonu:theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch {
        // Strona działa także bez dostępu do localStorage.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>JavaScript jest wymagany, aby korzystać z tej strony.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
