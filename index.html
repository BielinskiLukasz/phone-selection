<!doctype html>
<html lang="pl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Wybierz telefon po cechach, nie po nazwie. Quiz, suwaki albo jedno i drugie — dostajesz trzy anonimowe propozycje z ceną i procentem dopasowania, a nazwę i link do sklepu odkrywamy dopiero po Twoim wyborze."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="Wybór telefonu" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pl_PL" />
    <meta property="og:title" content="Wybór telefonu — po cechach, nie po nazwie" />
    <meta
      property="og:description"
      content="Trzy anonimowe propozycje: dopasowanie, cena i cechy. Nazwę odkrywamy dopiero po wyborze."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%232f6fed'/%3E%3Crect%20x='11'%20y='6'%20width='10'%20height='20'%20rx='2.6'%20fill='none'%20stroke='%23ffffff'%20stroke-width='2'/%3E%3Cpath%20d='M14%2011h4'%20stroke='%23ffffff'%20stroke-width='2'%20stroke-linecap='round'/%3E%3Ccircle%20cx='16'%20cy='22'%20r='1.7'%20fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <title>Wybór telefonu</title>
    <script>
      // Motyw ustawiony przed pierwszym renderem, żeby nie było błysku (UI-SPEC 6).
      try {
        if (localStorage.getItem('wybor-telefonu:theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch {
        // Strona działa także bez dostępu do localStorage.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>JavaScript jest wymagany, aby korzystać z tej strony.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
